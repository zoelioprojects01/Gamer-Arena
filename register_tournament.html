<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Setup for Inter font and dark mode aesthetics */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .form-card {
            background-color: #161b22;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .input-field {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <div id="registration-container" class="form-card p-6 md:p-8 rounded-xl border border-gray-700 w-full max-w-lg">
        <h1 class="text-3xl font-bold mb-3 text-center text-blue-400">Register for Tournament</h1>
        
        <!-- Tournament Info Display -->
        <p id="tournament-info" class="text-center mb-6 text-gray-400">
            Please fill out your details to register for the selected tournament.
        </p>

        <!-- Dynamic Message Area (for errors/success) -->
        <div id="message-box" class="hidden p-3 mb-4 rounded-lg text-sm transition-all duration-300 font-semibold"></div>

        <!-- Registration Form -->
        <form id="registration-form" class="space-y-4">
            
            <!-- Hidden Fields for Tournament ID and Game -->
            <input type="hidden" id="tournament-id" name="tournament_id" required>
            <input type="hidden" id="tournament-game" name="tournament_game" required>

            <div>
                <label for="ign" class="block text-sm font-medium mb-1 text-gray-300">In-Game Name (IGN)</label>
                <input type="text" id="ign" name="ign" placeholder="Your name in Free Fire/BGMI" required
                       class="input-field w-full p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="in-game-id" class="block text-sm font-medium mb-1 text-gray-300">In-Game User ID</label>
                <input type="text" id="in-game-id" name="in_game_id" placeholder="Your unique numerical UID" required
                       class="input-field w-full p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="mobile-number" class="block text-sm font-medium mb-1 text-gray-300">Mobile Number</label>
                <input type="tel" id="mobile-number" name="mobile_number" placeholder="10 digits for contact/prize collection" required pattern="[0-9]{10}" maxlength="10"
                       class="input-field w-full p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500">
                <p class="text-xs text-gray-500 mt-1">10 digits required.</p>
            </div>
            
            <button type="submit" id="register-button"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md shadow-blue-900/50 flex items-center justify-center">
                <span id="register-spinner" class="hidden animate-spin h-5 w-5 mr-3 border-2 border-white border-t-transparent rounded-full"></span>
                Confirm Registration
            </button>
        </form>

        <p class="text-center text-sm mt-6">
            <a href="dashboard.html" class="text-gray-400 hover:text-blue-400 transition">← Back to Dashboard</a>
        </p>
    </div>

    <!-- Firebase SDK Imports and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug');

        // --- HARDCODED FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyD7Ln4FWjEOs5K-ggRVsvVRR3XqVMiWRs4",
            authDomain: "tournament-app-62b78.firebaseapp.com",
            projectId: "tournament-app-62b78",
            storageBucket: "tournament-app-62b78.firebasestorage.app",
            messagingSenderId: "847639195339",
            appId: "1:847639195339:web:dc0511c1c8c5d907e9354e",
            measurementId: "G-MQJVKDMXWE"
        };
        
        // Use default-app-id if not provided by environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let app;
        let auth;
        let db;
        let currentUserId = null;
        let currentUserEmail = null;

        const registrationForm = document.getElementById('registration-form');
        const registerButton = document.getElementById('register-button');
        const registerSpinner = document.getElementById('register-spinner');
        const messageBox = document.getElementById('message-box');
        const tournamentInfo = document.getElementById('tournament-info');
        
        /** Displays a temporary message in the message box. */
        function displayMessage(text, styleClass) {
            messageBox.textContent = text;
            messageBox.className = `p-3 mb-4 rounded-lg text-sm transition-all duration-300 ${styleClass}`;
            messageBox.classList.remove('hidden');
        }

        /** Handles the final submission of registration data to Firestore. */
        async function submitRegistration(data) {
            registerButton.disabled = true;
            registerSpinner.classList.remove('hidden');

            try {
                // Path to store registrations: artifacts/{appId}/public/data/registrations/{uniqueDocId}
                const collectionPath = `artifacts/${appId}/public/data/registrations`;
                
                // Create a unique document ID based on user and tournament to prevent duplicate entries
                const docId = `${currentUserId}-${data.tournament_game}-${data.tournament_id}`;
                
                // Add the user data to the registration data object
                const finalData = {
                    ...data,
                    registered_by_uid: currentUserId,
                    registered_by_email: currentUserEmail,
                    timestamp: new Date().toISOString()
                };

                await setDoc(doc(db, collectionPath, docId), finalData);

                displayMessage("Registration successful! Good luck in the tournament!", 'bg-green-600 text-white');
                registrationForm.reset();
                
                // Optionally redirect after success
                setTimeout(() => window.location.href = 'dashboard.html', 3000);

            } catch (error) {
                console.error("Registration Submission Error:", error);
                
                let message = "Registration failed. Please try again.";
                if (error.code === 'permission-denied') {
                     message = "Access denied. Check your Firestore Security Rules (allow read, write: if request.auth != null;).";
                }
                
                displayMessage(`Error: ${message}`, 'bg-red-800 text-white');
            } finally {
                registerButton.disabled = false;
                registerSpinner.classList.add('hidden');
            }
        }
        
        /** Main initialization and URL parsing function */
        function initializeAndCheckAuth() {
            if (!firebaseConfig.apiKey) {
                console.error("Firebase config is missing.");
                window.location.href = 'index.html';
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const urlParams = new URLSearchParams(window.location.search);
                const game = urlParams.get('game');
                const id = urlParams.get('id');

                if (!game || !id) {
                    tournamentInfo.textContent = "Error: Missing tournament details. Returning to dashboard.";
                    setTimeout(() => window.location.href = 'dashboard.html', 2000);
                    return;
                }

                // Populate hidden fields and display info
                document.getElementById('tournament-id').value = id;
                document.getElementById('tournament-game').value = game;
                tournamentInfo.innerHTML = `You are registering for the <span class="uppercase font-bold text-yellow-400">${game}</span> tournament: <span class="font-mono text-gray-200">${id}</span>.`;

                // Check authentication state
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        currentUserEmail = user.email || 'N/A';
                        console.log("User authenticated:", currentUserId);
                        // Enable form submission
                        registrationForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            const formData = new FormData(registrationForm);
                            const data = Object.fromEntries(formData.entries());
                            submitRegistration(data);
                        });
                    } else {
                        console.log("User is NOT authenticated. Redirecting to login.");
                        window.location.href = 'index.html'; 
                    }
                });

            } catch (e) {
                console.error("Firebase Initialization Failed:", e);
                displayMessage("Critical Error. Failed to initialize services.", 'bg-red-800 text-white');
                setTimeout(() => window.location.href = 'index.html', 3000);
            }
        }

        window.onload = initializeAndCheckAuth;
    </script>
</body>
</html>
